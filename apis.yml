apis:
- aid: mezmo:mezmo-views-api
  name: Mezmo Views API
  tags:
  - Logs
  - Views
  - Saved Searches
  - Observability
  humanURL: https://docs.mezmo.com/log-analysis-api/reference/views
  properties:
  - url: https://docs.mezmo.com/log-analysis-api/reference/views
    type: Documentation
  - url: openapi/mezmo-views-api-openapi.yml
    type: OpenAPI
  description: >-
    Manage Mezmo log Views via /v1/config/view. Views are saved query definitions over hosts, apps, levels,
    tags, and free-text filters and are the unit alerts attach to.
- aid: mezmo:mezmo-archiving-api
  name: Mezmo Archiving API
  tags:
  - Archiving
  - Logs
  - Storage
  - Compliance
  humanURL: https://docs.mezmo.com/log-analysis-api/reference/archiving
  properties:
  - url: https://docs.mezmo.com/log-analysis-api/reference/archiving
    type: Documentation
  - url: openapi/mezmo-archiving-api-openapi.yml
    type: OpenAPI
  description: >-
    Configure cold-storage archiving via /v1/config/archiving. Supports S3, GCS, Azure Blob, IBM COS,
    and DigitalOcean Spaces destinations for long-term retention beyond plan limits.
- aid: mezmo:mezmo-usage-api
  name: Mezmo Usage API
  tags:
  - Usage
  - Billing
  - Reporting
  - FinOps
  humanURL: https://docs.mezmo.com/log-analysis-api/reference/usage
  properties:
  - url: https://docs.mezmo.com/log-analysis-api/reference/usage
    type: Documentation
  - url: openapi/mezmo-usage-api-openapi.yml
    type: OpenAPI
  description: >-
    Query log usage by app, host, or tag via /v1/usage/{type} and detailed byte-based consumption via
    /v2/usage. Used for chargeback, anomaly detection, and capacity planning against ingestion contract
    volumes.
- aid: mezmo:mezmo-agent
  name: Mezmo Agent (logdna-agent-v2)
  tags:
  - Agent
  - SDK
  - Open Source
  - Logs
  humanURL: https://github.com/logdna/logdna-agent-v2
  properties:
  - url: https://github.com/logdna/logdna-agent-v2
    type: SourceCode
  - url: https://docs.mezmo.com/docs/mezmo-agent
    type: Documentation
  description: >-
    Open-source Rust log collection agent (logdna-agent-v2). Tails files, journald, and Kubernetes pod
    logs and ships to Mezmo's ingestion endpoint. MIT-licensed.
- aid: mezmo:mezmo-aura
  name: AURA Agent Framework
  tags:
  - AI
  - Agents
  - Open Source
  - MCP
  - SRE
  humanURL: https://github.com/mezmo/aura
  properties:
  - url: https://github.com/mezmo/aura
    type: SourceCode
  - url: https://www.mezmo.com/
    type: Documentation
  description: >-
    Mezmo's open-source agentic orchestration framework. Apache 2.0 Rust framework for composing AI agents
    from declarative TOML config, with MCP tool integration, RAG pipelines (Qdrant, Bedrock KB), and an
    OpenAI-compatible web API. LLM-agnostic (OpenAI, Anthropic, Bedrock, Gemini, Ollama). Backs Mezmo's
    AI SRE and root-cause-analysis workflows.
