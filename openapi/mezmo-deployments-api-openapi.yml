openapi: 3.0.3
info:
  title: Mezmo Alerts Archiving Deployments API
  description: 'Manage Mezmo preset alerts. Preset alerts encapsulate presence or absence

    triggers, frequency, count thresholds, and notification channels (PagerDuty,

    Slack, webhook, email) that views attach to.

    '
  version: '1.0'
servers:
- url: https://api.mezmo.com
security:
- AccessToken: []
tags:
- name: Deployments
paths:
  /pipelines/{pipelineId}/publish:
    parameters:
    - $ref: '#/components/parameters/PipelineId'
    post:
      tags:
      - Deployments
      summary: Publish Pipeline
      operationId: publishPipeline
      responses:
        '200':
          description: Pipeline published to the active deployment.
  /pipelines/{pipelineId}/revert:
    parameters:
    - $ref: '#/components/parameters/PipelineId'
    post:
      tags:
      - Deployments
      summary: Revert Pipeline
      operationId: revertPipeline
      responses:
        '200':
          description: Pipeline reverted to the previously published version.
components:
  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    AccessToken:
      type: http
      scheme: bearer
