openapi: 3.2.0
info:
  title: Mezmo Edge Tasks API
  description: 'Edge / local deployment surface for Mezmo Pipelines. Self-hosted pipeline

    instances poll the control plane for configuration, send heartbeats, accept

    tasks, and report results.

    '
  version: v3
servers:
- url: https://api.mezmo.com/v3
security:
- PipelineServiceKey: []
tags:
- name: Tasks
paths:
  /edge/clients/{clientId}/tasks:
    parameters:
    - name: clientId
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Tasks
      summary: List Pending Tasks
      operationId: listEdgeTasks
      responses:
        '200':
          description: Pending tasks for the edge client.
  /edge/clients/{clientId}/tasks/{taskId}/result:
    parameters:
    - name: clientId
      in: path
      required: true
      schema:
        type: string
    - name: taskId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Tasks
      summary: Submit Task Result
      operationId: submitTaskResult
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Result accepted.
components:
  securitySchemes:
    PipelineServiceKey:
      type: http
      scheme: bearer
