openapi: 3.2.0
info:
  title: Mezmo Pipeline Audit Events API
  description: 'Programmatic CRUD over Mezmo Telemetry Pipelines. Manage pipelines, sources,

    processors, destinations, deployments, audit events, and account-wide

    metrics. Backs the Mezmo CLI, Terraform provider, and MCP server.

    '
  version: v3
  contact:
    name: Mezmo
    url: https://www.mezmo.com/
servers:
- url: https://api.mezmo.com/v3
  description: Production Pipeline API
security:
- PipelineServiceKey: []
tags:
- name: AuditEvents
paths:
  /pipelines/{pipelineId}/audit:
    parameters:
    - $ref: '#/components/parameters/PipelineId'
    get:
      tags:
      - AuditEvents
      summary: List Audit Events
      operationId: listAuditEvents
      responses:
        '200':
          description: Audit log for the pipeline.
components:
  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    PipelineServiceKey:
      type: http
      scheme: bearer
      description: 'Authorization: Token {PIPELINE_SERVICE_KEY}'
