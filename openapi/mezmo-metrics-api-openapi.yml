openapi: 3.2.0
info:
  title: Mezmo Pipeline Metrics API
  description: 'Programmatic CRUD over Mezmo Telemetry Pipelines. Manage pipelines, sources,

    processors, destinations, deployments, audit events, and account-wide

    metrics. Backs the Mezmo CLI, Terraform provider, and MCP server.

    '
  version: v3
  contact:
    name: Mezmo
    url: https://www.mezmo.com/
servers:
- url: https://api.mezmo.com/v3
  description: Production Pipeline API
security:
- PipelineServiceKey: []
tags:
- name: Metrics
paths:
  /metrics/events:
    get:
      tags:
      - Metrics
      summary: Get Event Metrics
      operationId: getEventMetrics
      parameters:
      - name: pipelineId
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: integer
          format: int64
      - name: to
        in: query
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Event rate / volume metrics.
components:
  securitySchemes:
    PipelineServiceKey:
      type: http
      scheme: bearer
      description: 'Authorization: Token {PIPELINE_SERVICE_KEY}'
