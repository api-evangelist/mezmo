openapi: 3.2.0
info:
  title: Mezmo Edge Heartbeats API
  description: 'Edge / local deployment surface for Mezmo Pipelines. Self-hosted pipeline

    instances poll the control plane for configuration, send heartbeats, accept

    tasks, and report results.

    '
  version: v3
servers:
- url: https://api.mezmo.com/v3
security:
- PipelineServiceKey: []
tags:
- name: Heartbeats
paths:
  /edge/clients/{clientId}/heartbeat:
    parameters:
    - name: clientId
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Heartbeats
      summary: Send Heartbeat
      operationId: sendHeartbeat
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Heartbeat acknowledged; returns any pending tasks.
components:
  schemas:
    Heartbeat:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        status:
          type: string
        version:
          type: string
  securitySchemes:
    PipelineServiceKey:
      type: http
      scheme: bearer
