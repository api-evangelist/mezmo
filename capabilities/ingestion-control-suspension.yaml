naftiko: 1.0.0-alpha2
info:
  label: Mezmo Ingestion Control — Suspension
  description: Suspend, confirm, and resume ingestion for a Mezmo account.
  tags:
  - Mezmo
  - Ingestion
  - Suspension
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MEZMO_ACCESS_TOKEN: MEZMO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: ingestion-control-suspension
    baseUri: https://api.mezmo.com/v1/config/ingestion
    resources:
    - name: status
      path: /status
      operations:
      - name: getingestionstatus
        method: GET
        description: Mezmo Get Ingestion Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suspend
      path: /suspend
      operations:
      - name: suspendingestion
        method: POST
        description: Mezmo Initiate Ingestion Suspension
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: suspend-confirm
      path: /suspend/confirm
      operations:
      - name: confirmsuspendingestion
        method: POST
        description: Mezmo Confirm Ingestion Suspension
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: resume
      path: /resume
      operations:
      - name: resumeingestion
        method: POST
        description: Mezmo Resume Ingestion
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Token {{env.MEZMO_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: ingestion-control-suspension-mcp
    port: 9090
    transport: http
    tools:
    - name: mezmo-get-ingestion-status
      description: Mezmo Get Ingestion Status
      hints:
        readOnly: true
      call: ingestion-control-suspension.getingestionstatus
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-suspend-ingestion
      description: Mezmo Initiate Ingestion Suspension
      hints:
        destructive: true
      call: ingestion-control-suspension.suspendingestion
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-confirm-suspend-ingestion
      description: Mezmo Confirm Ingestion Suspension
      hints:
        destructive: true
      call: ingestion-control-suspension.confirmsuspendingestion
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-resume-ingestion
      description: Mezmo Resume Ingestion
      call: ingestion-control-suspension.resumeingestion
      outputParameters:
      - type: object
        mapping: $.
