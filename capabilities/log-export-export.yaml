naftiko: 1.0.0-alpha2
info:
  label: Mezmo Log Export API — Export
  description: Naftiko capability for querying and paginating historical log exports from Mezmo.
  tags:
  - Mezmo
  - Logs
  - Export
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MEZMO_ACCESS_TOKEN: MEZMO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: log-export-export
    baseUri: https://api.mezmo.com
    description: Mezmo Export endpoints (V1 and V2).
    resources:
    - name: v1-export
      path: /v1/export
      operations:
      - name: exportlogsv1
        method: GET
        description: Mezmo Export Logs V1
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          required: true
        - name: to
          in: query
          type: integer
          required: true
        - name: query
          in: query
          type: string
          required: false
    - name: v2-export
      path: /v2/export
      operations:
      - name: exportlogsv2
        method: GET
        description: Mezmo Export Logs V2
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          required: true
        - name: to
          in: query
          type: integer
          required: true
        - name: query
          in: query
          type: string
          required: false
        - name: pagination_id
          in: query
          type: string
          required: false
        - name: size
          in: query
          type: integer
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: 'Token {{env.MEZMO_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: log-export-export-mcp
    port: 9090
    transport: http
    description: MCP adapter for log export.
    tools:
    - name: mezmo-export-logs-v1
      description: Mezmo Export Logs V1
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: log-export-export.exportlogsv1
      with:
        from: tools.from
        to: tools.to
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-export-logs-v2
      description: Mezmo Export Logs V2 (paginated)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: log-export-export.exportlogsv2
      with:
        from: tools.from
        to: tools.to
        query: tools.query
        pagination_id: tools.pagination_id
        size: tools.size
      outputParameters:
      - type: object
        mapping: $.
