naftiko: 1.0.0-alpha2
info:
  label: Mezmo Usage API — Usage
  description: Query log usage by app, host, tag, and detailed byte-based consumption for FinOps.
  tags:
  - Mezmo
  - Usage
  - FinOps
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MEZMO_ACCESS_TOKEN: MEZMO_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: usage-usage
    baseUri: https://api.mezmo.com
    resources:
    - name: v1-usage-type
      path: /v1/usage/{type}
      operations:
      - name: getusagebytype
        method: GET
        description: Mezmo Get Usage By Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          required: true
        - name: to
          in: query
          type: integer
          required: true
    - name: v2-usage
      path: /v2/usage
      operations:
      - name: getusagedetailed
        method: GET
        description: Mezmo Get Detailed Usage
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: from
          in: query
          type: integer
          required: true
        - name: to
          in: query
          type: integer
          required: true
        - name: groupby
          in: query
          type: string
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: 'Token {{env.MEZMO_ACCESS_TOKEN}}'
      placement: header
  exposes:
  - type: mcp
    namespace: usage-usage-mcp
    port: 9090
    transport: http
    tools:
    - name: mezmo-get-usage-by-type
      description: Mezmo Get Usage By Type
      hints:
        readOnly: true
      call: usage-usage.getusagebytype
      with:
        from: tools.from
        to: tools.to
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-get-usage-detailed
      description: Mezmo Get Detailed Usage
      hints:
        readOnly: true
      call: usage-usage.getusagedetailed
      with:
        from: tools.from
        to: tools.to
        groupby: tools.groupby
      outputParameters:
      - type: object
        mapping: $.
