naftiko: 1.0.0-alpha2
info:
  label: Mezmo Pipeline API — Processors
  description: CRUD over pipeline processor nodes (VRL, parse, filter, redact, sample, route).
  tags:
  - Mezmo
  - Pipelines
  - Processors
  created: '2026-05-25'
  modified: '2026-05-25'
binds:
- namespace: env
  keys:
    MEZMO_PIPELINE_KEY: MEZMO_PIPELINE_KEY
capability:
  consumes:
  - type: http
    namespace: pipeline-processors
    baseUri: https://api.mezmo.com/v3
    resources:
    - name: processors
      path: /pipelines/{pipelineId}/processors
      operations:
      - name: listprocessors
        method: GET
        description: Mezmo List Processors
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createprocessor
        method: POST
        description: Mezmo Create Processor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
    - name: processors-nodeid
      path: /pipelines/{pipelineId}/processors/{nodeId}
      operations:
      - name: getprocessor
        method: GET
        description: Mezmo Get Processor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateprocessor
        method: PUT
        description: Mezmo Update Processor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          required: true
      - name: deleteprocessor
        method: DELETE
        description: Mezmo Delete Processor
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: 'Token {{env.MEZMO_PIPELINE_KEY}}'
      placement: header
  exposes:
  - type: mcp
    namespace: pipeline-processors-mcp
    port: 9090
    transport: http
    tools:
    - name: mezmo-list-processors
      description: Mezmo List Processors
      hints:
        readOnly: true
      call: pipeline-processors.listprocessors
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-create-processor
      description: Mezmo Create Processor
      call: pipeline-processors.createprocessor
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-get-processor
      description: Mezmo Get Processor
      hints:
        readOnly: true
      call: pipeline-processors.getprocessor
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-update-processor
      description: Mezmo Update Processor
      call: pipeline-processors.updateprocessor
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: mezmo-delete-processor
      description: Mezmo Delete Processor
      hints:
        destructive: true
      call: pipeline-processors.deleteprocessor
      outputParameters:
      - type: object
        mapping: $.
